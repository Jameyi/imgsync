services:
  imgsync:
    build:
      context: .
      args:
        # Build-time inlined: sitemap/canonical/OG derive from it.
        # Set NEXT_PUBLIC_URL in the shell or .env.docker before building.
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        # GA4 measurement ID; funnel events flow only when set.
        NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID}
    image: imgsync:latest
    container_name: imgsync
    restart: unless-stopped
    ports:
      # host 3001 -> container 3000 (change host port if occupied:
      # check first with `ss -tlnp | grep 3001`)
      - "3001:3000"
    environment:
      # runtime vars (indexable is derived from NEXT_PUBLIC_URL at build time)
      NODE_ENV: production
    networks:
      - default
      - civvue

# civvue-nginx (the 80/443 edge) reaches this container by name `imgsync:3000`
# over the civvue network; declared external so `up -d --build` re-attaches
# automatically instead of losing the runtime `docker network connect`.
networks:
  civvue:
    external: true
    name: civvue_civvue-network
